name: 오류 제보
description: 로컬 진단 파일과 최소 재현 절차로 오류를 알려주세요.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        먼저 `aptly report --format both --output-dir reports`로 로컬 진단 파일을 생성해 주세요.
        생성한 내용을 직접 검토한 뒤 JSON 진단 파일을 필수 첨부하고, 필요하면 같은 report_id의 Markdown도 추가해 주세요.
        자동 업로드는 없어요. 키·개인 경로·업무 본문·원문 설정·transcript를 공개하지 말아 주세요.
        보안 취약점은 이 양식 대신 저장소의 `SECURITY.md`에 있는 비공개 제보 절차를 확인해 주세요.
  - type: textarea
    id: observed
    attributes:
      label: 발생한 현상
      description: 어떤 명령이나 동작에서 무엇이 달라졌는지 간단히 적어 주세요. 원시 오류·설정·작업 본문 대신 안전한 오류 코드를 사용해 주세요.
      placeholder: "예: report 명령이 파일 생성 단계에서 고정 오류 코드를 반환했어요."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 최소 재현 절차
      description: 공개 가능한 합성 입력으로 재현 절차를 적어 주세요. 실제 키·개인 경로·사용자 설정 파일은 붙이지 말아 주세요.
      placeholder: |
        1. 소스 설치 또는 로컬 패키지 설치 방식을 적어요.
        2. 비밀을 제외한 명령과 합성 입력으로 실행해요.
        3. 관측한 상태 또는 오류 코드를 적어요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
      description: 같은 입력에서 어떤 결과를 기대했는지 적어 주세요.
    validations:
      required: true
  - type: input
    id: report-id
    attributes:
      label: report_id
      description: 첨부한 진단 파일의 report_id를 그대로 적어 주세요. MCP 요청 ID나 세션 ID가 아니에요.
      placeholder: 진단 파일에 생성된 UUID
    validations:
      required: true
  - type: upload
    id: diagnostic-json
    attributes:
      label: JSON 진단 파일 (필수)
      description: |
        report가 생성한 diagnostic-<report_id>.json 파일을 검토한 뒤 끌어 놓거나 선택해 주세요.
        확장자 검사는 JSON 내부 스키마·비밀 비포함·report_id 일치를 검증하지 않아요.
    validations:
      required: true
      accept: ".json"
  - type: textarea
    id: diagnostic-markdown
    attributes:
      label: Markdown 진단 결과 (선택)
      description: |
        같은 report_id의 .md 파일을 첨부하거나 내용을 붙여 넣어도 돼요. 자동 업로드는 없어요.
        UI에서 .md 첨부가 거부되면 검토한 Markdown 내용만 이 칸에 붙여 넣어 주세요. 원시 로그·개인 설정은 넣지 말아 주세요.
      placeholder: 같은 실행에서 생성한 Markdown 파일 또는 검토한 내용을 추가해 주세요.
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: 첨부 전 확인
      options:
        - label: 생성한 진단 파일을 직접 열어 내용을 검토했어요.
          required: true
        - label: 제보 본문과 첨부에 키·환경변수 값·개인 경로·업무 본문·원문 설정·transcript를 넣지 않았어요.
          required: true
        - label: JSON 진단 파일을 첨부했고 이슈의 report_id가 첨부 파일과 같아요. Markdown도 추가했다면 동일한 report_id예요.
          required: true
