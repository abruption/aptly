name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-credential-store:
    name: Windows credential backend
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      APTLY_SKIP_SETUP: '1'
      APTLY_TEST_CREDENTIAL_STORE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install and build without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Verify Windows executable selection, stdin decoding and redacted failures
        run: node --test test/secret-store.test.ts test/cli-input.test.ts
      - name: Verify an isolated synthetic Windows credential
        run: node test-support/credential-store-live.ts
  windows-package:
    name: Installed package / Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    env:
      APTLY_SKIP_SETUP: '1'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ROUTER_PROVIDER: fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Regress Windows package installation and compiled CLI execution
        run: npm run test:package
      - name: Verify process-lifetime ledger locks and crash recovery
        env:
          POC_TEST_TMP_ROOT: ${{ runner.temp }}
        run: |
          # Warm the native runtime before the bounded ACL checks; serialize
          # test files so their first PowerShell startups do not compete.
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 test/ledger-lock.test.ts test/ledger-crash.test.ts
  mock-tests:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ROUTER_PROVIDER: fixture
      APTLY_SKIP_SETUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build TypeScript
        run: npm run typecheck && npm run build
      - name: Run mock policy and local stdio integration tests
        env:
          POC_TEST_TMP_ROOT: ${{ runner.temp }}
        run: npm test
      - name: Check public release contents
        run: npm run check:release
      - name: Run fixture MCP smoke test
        env:
          POC_TEST_TMP_ROOT: ${{ runner.temp }}
        run: npm run poc
      - name: Install and smoke-test the packed artifact in a clean prefix
        run: npm run test:package
