name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-tests:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ROUTER_PROVIDER: fixture
      APTLY_SKIP_SETUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build TypeScript
        run: npm run typecheck && npm run build
      - name: Run mock policy and local stdio integration tests
        env:
          POC_TEST_TMP_ROOT: ${{ runner.temp }}
        run: npm test
      - name: Check public release contents
        run: npm run check:release
      - name: Run fixture MCP smoke test
        env:
          POC_TEST_TMP_ROOT: ${{ runner.temp }}
        run: npm run poc
      - name: Install and smoke-test the packed artifact in a clean prefix
        run: node scripts/package-smoke.ts
